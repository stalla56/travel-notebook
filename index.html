<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#EEF4F3">
<!-- 這一頁只有通關碼表單。行程內容在 payload.bin 裡，是加密過的；輸入正確的通關碼才會在瀏覽器裡解開。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob: https://tile.openstreetmap.de https://*.tile.openstreetmap.fr https://tile.openstreetmap.org; connect-src 'self' https://api.open-meteo.com; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>旅行手帳</title>
<style>
:root{color-scheme:light dark;--bg:#EEF4F3;--card:#fff;--ink:#1F2D3D;--muted:#526173;--navy:#1F3A5F;--on:#fff;--red:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#111A22;--card:#1A2530;--ink:#E6EDF3;--muted:#A3B3C2;--navy:#86A9D1;--on:#0F1A26;--red:#FF8F82}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font:16px/1.7 "PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{width:100%;max-width:400px;background:var(--card);border:1.5px solid var(--navy);border-radius:16px;padding:22px 18px}
h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
p{margin:0 0 14px;color:var(--muted)}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;min-height:52px;font:inherit;font-size:18px;padding:8px 12px;border:1.5px solid var(--navy);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:10px 0 14px;font-size:15px;color:var(--muted)}
.row input{width:22px;height:22px}
button{width:100%;min-height:56px;font:inherit;font-weight:700;font-size:17px;border:1.5px solid var(--navy);border-radius:12px;background:var(--navy);color:var(--on);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
button.ghost{background:transparent;color:var(--navy);min-height:44px;margin-top:8px;font-size:15px}
#msg{min-height:1.7em;margin:12px 0 0;font-weight:700}
#msg.bad{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>旅行手帳</h1>
  <p id="lead">讀取中…</p>
  <form id="f" hidden autocomplete="off">
    <label for="p">通關碼</label>
    <input id="p" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <div class="row"><input id="show" type="checkbox"><label for="show" style="margin:0;font-weight:400">顯示通關碼</label></div>
    <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="margin:0;font-weight:400">這支手機記住，下次不用再輸入</label></div>
    <button id="go" type="submit">開啟</button>
  </form>
  <button id="retry" class="ghost" hidden type="button">重新讀取</button>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  "use strict";
  var ITER=600000, STORE="trip-gate-key";
  var $=function(id){return document.getElementById(id)}, buf=null;
  function say(t,bad){$("msg").textContent=t||"";$("msg").className=bad?"bad":""}
  function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
  async function load(){
    var r=await fetch("payload.bin");if(!r.ok)throw new Error("http "+r.status);
    var u=new Uint8Array(await r.arrayBuffer());
    if(u.length<100||u[0]!==83||u[1]!==84||u[2]!==49)throw new Error("format");
    return u}
  async function derive(pass){
    var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:buf.subarray(4,20),iterations:ITER,hash:"SHA-256"},k,512))}
  /* returns the page's HTML, or null when the key does not fit */
  async function unlock(dk){
    var iv=buf.subarray(20,36),mac=buf.subarray(36,68),ct=buf.subarray(68);
    var mk=await crypto.subtle.importKey("raw",dk.subarray(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
    var signed=new Uint8Array(16+ct.length);signed.set(iv,0);signed.set(ct,16);
    if(!(await crypto.subtle.verify("HMAC",mk,mac,signed)))return null;
    var ek=await crypto.subtle.importKey("raw",dk.subarray(0,32),{name:"AES-CBC"},false,["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},ek,ct))}
  function show(html){window.__GATED=true;document.open();document.write(html);document.close()}
  function form(){$("lead").textContent="請輸入通關碼。不知道的話，請問分享這個連結給你的人。";$("f").hidden=false;$("retry").hidden=true;try{$("p").focus()}catch(e){}}
  async function start(){
    $("retry").hidden=true;$("f").hidden=true;$("lead").textContent="讀取中…";say("");
    if(!(window.crypto&&crypto.subtle)){$("lead").textContent="這個瀏覽器不支援解密，請改用 Safari 或 Chrome 開啟這個連結。";return}
    try{buf=await load()}catch(e){$("lead").textContent="讀不到內容，可能是沒有網路。";$("retry").hidden=false;return}
    var saved=null;try{saved=localStorage.getItem(STORE)}catch(e){}
    if(saved){try{var html=await unlock(unb64(saved));if(html){show(html);return}}catch(e){}
      try{localStorage.removeItem(STORE)}catch(e){}
      form();say("內容更新過或通關碼換了，請再輸入一次。");return}
    form()}
  $("show").addEventListener("change",function(){$("p").type=this.checked?"text":"password"});
  $("retry").addEventListener("click",start);
  $("f").addEventListener("submit",async function(e){
    e.preventDefault();var pass=$("p").value.trim();if(pass.normalize)pass=pass.normalize("NFC");if(!pass)return;
    $("go").disabled=true;say("解開中，請稍等…");
    try{var dk=await derive(pass),html=await unlock(dk);
      if(!html){say("通關碼不對，請再試一次。",true);$("go").disabled=false;$("p").select();return}
      if($("keep").checked){try{localStorage.setItem(STORE,b64(dk))}catch(e2){}}
      show(html)}
    catch(err){say("解不開，請重新整理頁面再試一次。",true);$("go").disabled=false}});
  start();
})();
</script>
</body>
</html>
